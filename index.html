<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Калькулятор пиров</title>
<style>
:root{--bg:#fff8ef;--tx:#2b1d14;--tx2:#6e5a4c;--ac:#b4441e;--soft:#f6e3cf;--ln:#ead6c0;--bar:#fff1e0;--bln:#e5cdb3;--box:#8a7565}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:28px 20px 16px}
h1{margin:0 0 12px;font-size:32px;font-weight:700}
.sub{font-size:15px;color:var(--tx2);margin:-6px 0 12px}
.cap{font-size:14px;color:var(--tx2);margin:12px 0 4px}
.up{text-transform:uppercase;letter-spacing:.04em}
.ppl{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:8px 8px 8px 16px;margin-bottom:12px}
.ppl b{font-size:17px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border:0;border-radius:10px;background:var(--bg);font-size:24px;color:var(--tx)}
.step span{min-width:48px;text-align:center;font-size:24px;font-weight:700}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--ln);min-height:44px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit}
.row .t{flex:1}
.row .t div:first-child{font-size:17px}
.row .t div+div{font-size:14px;color:var(--tx2)}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--box);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.on .cb{background:var(--ac);border-color:var(--ac)}
.q{text-align:right;font-size:17px;font-weight:600}
.q small{display:block;font-size:14px;font-weight:400;color:var(--tx2)}
.done .t div:first-child,.done .q{color:var(--tx2);text-decoration:line-through}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;padding:10px 0;border-radius:8px;background:none;font-size:15px;color:#4a3a2f}
.seg button.a{background:var(--bg);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:0;padding:10px 16px;border-radius:20px;background:var(--soft);font-size:15px;color:#4a3a2f}
.chips button.a{background:var(--ac);color:#fff;font-weight:600}
.ing{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);min-height:44px;font-size:17px}
.stp{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.stp i{width:28px;height:28px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;font-weight:600;font-style:normal}
.stp div{font-size:16px;line-height:1.4}
.empty{color:var(--tx2);font-size:15px;padding:16px 0}
.sum{font-size:15px;color:#4a3a2f;font-weight:600;margin-top:12px}
nav{display:flex;border-top:1px solid var(--bln);background:var(--bar);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;min-height:48px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx2);font-size:12px}
nav button.a{color:var(--ac);font-weight:600}
.ver{font-size:12px;color:var(--tx2);text-align:center;padding:16px 0 0}
</style>
</head>

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const num=n=>{let v=n>=10?Math.round(n):Math.round(n*10)/10;return v.toLocaleString('ru-RU',{maximumFractionDigits:1})};
const state={tab:'dishes',persons:8,sel:new Set(),stock:new Set(),shop:'all',cook:null};

// количество: граммы из рецепта на порцию × персоны; мл — если плотность известна; ≈ — если статус не «USDA»/«по определению»
function qty(name,gPer){const g=gPer*state.persons;const d=dens[name.toLowerCase()];let ml=null,approx=false;
 if(d&&d.density_g_ml){ml=g/d.density_g_ml;approx=!(d.status==='USDA'||d.status==='по определению')}
 return{g,ml,approx}}
function qHtml(q,onlyMl){ if(onlyMl) return `<div class="q">${num(q.ml)} мл</div>`;
 return `<div class="q">${num(q.g)} г${q.ml!=null?`<small>${q.approx?'≈ ':''}${num(q.ml)} мл</small>`:''}</div>`}
function shopList(){const m=new Map();

 else{
  h+=`<h1>Готовка</h1>`;const ids=[...state.sel].sort((a,b)=>a-b);
  if(!ids.length)h+=`<div class="empty">Сначала выберите блюда на вкладке «Блюда».</div>`;
